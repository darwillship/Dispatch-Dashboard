<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch Board</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#172033;--muted:#7b8495;--line:#e4e8ef;--blue:#2563eb;--green:#16966a;--amber:#e7a914;--red:#df4b4b;--shadow:0 8px 28px rgba(20,30,50,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:72px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px}header h1{font-size:20px;margin:0}header small{color:#9ca3af}.live{display:flex;gap:8px;align-items:center;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
main{padding:24px;max-width:1700px;margin:auto}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.toolbar h2{margin:0 0 4px;font-size:22px}.muted{color:var(--muted)}button{font:inherit;border:0;cursor:pointer}.btn{padding:10px 14px;border-radius:10px;font-weight:750}.primary{background:var(--blue);color:white}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}
.board{display:grid;grid-template-columns:300px 300px minmax(500px,1fr);gap:16px;align-items:start}.lane{background:#eef1f5;border:1px solid var(--line);border-radius:16px;min-height:620px;padding:12px}.lane-head{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 13px}.lane-title{font-weight:850}.count{background:#dde3eb;color:#596273;border-radius:99px;padding:4px 8px;font-size:11px}.dropzone{min-height:520px;border-radius:12px}.dropzone.over,.driver-routes.over{outline:2px dashed var(--blue);outline-offset:3px;background:#edf4ff}
.task{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 3px 10px rgba(20,30,50,.04);cursor:grab}.task.dragging{opacity:.35}.task-top{display:flex;justify-content:space-between;gap:8px}.route{font-weight:850;line-height:1.35}.grip{color:#a5adba}.meta{font-size:11px;color:var(--muted);line-height:1.55;margin-top:7px}.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:99px;padding:4px 7px;background:#f1f5f9;margin-top:7px}.tag.high{background:#fff0f0;color:#b42323}.task-actions{display:flex;gap:6px;margin-top:10px}.mini{font-size:11px;padding:6px 8px;border-radius:7px;background:#f5f7fa;color:#566070}.mini.danger{color:#b42323}
.drivers-lane{background:transparent;border:0;padding:0;min-height:620px}.drivers-head{display:flex;justify-content:space-between;align-items:center;margin:5px 2px 13px}.drivers{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:12px}.driver{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;min-height:150px}.driver-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.driver-name{font-weight:850}.driver-routes{padding:10px;min-height:90px}.empty{color:#a0a8b5;text-align:center;padding:25px 8px;font-size:12px}.driver .task{background:#fbfcfe}.status{font-size:10px;font-weight:850;text-transform:uppercase}.status.in_progress{color:#9a6a00}.status.completed{color:#087a52}.status.assigned{color:#2257ba}
.modal{position:fixed;inset:0;background:rgba(10,16,28,.55);display:none;align-items:flex-start;justify-content:center;padding:35px 16px;z-index:20;overflow:auto}.modal.show{display:flex}.dialog{width:min(760px,100%);background:white;border-radius:16px;overflow:hidden}.dialog-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog form{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;display:block;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d8dde6;border-radius:9px;padding:10px 11px;font:inherit;background:white}textarea{min-height:80px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.close{background:none;font-size:22px}
@media(max-width:1100px){.board{grid-template-columns:1fr 1fr}.drivers-lane{grid-column:1/-1}}@media(max-width:700px){main{padding:14px}.board{grid-template-columns:1fr}.drivers-lane{grid-column:auto}.drivers{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><header><div><h1>Dispatch Board</h1><small>Planning → Ready → Drivers · Build 2.0</small></div><div class="live"><i class="dot"></i><span id="conn">Connecting…</span></div></header>
<main><div class="toolbar"><div><h2>Today's Dispatch</h2><div class="muted">Plan quickly. Drag when you're ready.</div></div><div><button class="btn ghost" onclick="load()">Refresh</button> <button class="btn primary" onclick="openTask('brainstorm')">+ Quick Task</button></div></div>
<div class="board">
<section class="lane"><div class="lane-head"><span class="lane-title">💡 Brainstorm & Pre-Plan</span><span class="count" id="brainCount">0</span></div><div class="dropzone" id="brainstorm" data-stage="brainstorm"></div></section>
<section class="lane"><div class="lane-head"><span class="lane-title">✓ Ready to Assign</span><span class="count" id="readyCount">0</span></div><div class="dropzone" id="ready" data-stage="ready"></div></section>
<section class="drivers-lane"><div class="drivers-head"><span class="lane-title">Drivers</span><span class="muted">Drop a task onto a driver</span></div><div class="drivers" id="drivers"></div></section>
</div></main>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><div><b id="modalTitle">New Task</b><div class="muted" style="font-size:12px;margin-top:3px">Add what you know now. Finish details later.</div></div><button class="close" onclick="closeTask()">×</button></div>
<form id="form"><input type="hidden" id="id"><input type="hidden" id="stage"><div class="grid">
<div><label>Pickup *</label><select id="pickup" required></select></div><div><label>Delivery *</label><select id="delivery" required></select></div>
<div><label>Scheduled</label><input id="scheduled" type="datetime-local"></div><div><label>Priority</label><select id="priority"><option>normal</option><option>high</option><option>low</option></select></div>
<div><label>Client / Job</label><input id="job"></div><div><label>Material</label><input id="material"></div>
<div><label>Pallets</label><input id="pallets" type="number" min="0"></div><div><label>Task Type</label><select id="type"><option>shuttle</option><option>pickup</option><option>delivery</option><option>other</option></select></div>
<div class="full"><label>Instructions</label><textarea id="notes"></textarea></div></div>
<div class="form-actions"><button type="button" class="btn ghost" onclick="closeTask()">Cancel</button><button class="btn primary">Save Task</button></div></form></div></div>
<script>
const SUPABASE_URL="https://hqhfstosclasgwgxubip.supabase.co";
const SUPABASE_KEY="sb_publishable_01rvOlUuiba6260MPA1g4A_5oFgpGCk";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOC=[["ALG","1053 N Schmidt Rd, Romeoville, IL 60446"],["ENRU","1000 Windham Pkwy, Bolingbrook, IL 60490"],["Darwill Hillside","11900 Roosevelt Rd, Hillside, IL 60162"],["Darwill McCook","8701 47th St Ste C, McCook, IL 60525"],["South Suburban Post Office","6801 W 73rd St, Bedford Park, IL 60499"],["Fox Valley Post Office","3900 Gabrielle Ln, Aurora, IL 60598"],["Carol Stream Post Office","550 E Fullerton Ave, Carol Stream, IL 60188"],["Worth Post Office","11114 S Harlem Ave, Worth, IL 60482"],["Bolingbrook Post Office","105 Canterbury Ln, Bolingbrook, IL 60440"],["Darwill Oakbrook Tower Terrace","1 Tower Ln, Oakbrook Terrace, IL 60181"],["Envelopes Only","2000 S Park Ave, Streamwood, IL 60107"],["Federal Envelope","608 Country Club Dr, Bensenville, IL 60106"],["Universal Laminating","910 Carlow Dr Ste A, Bolingbrook, IL 60490"],["Platinum Converting","1560 W Stearns Rd, Bartlett, IL 60103"],["Victor Envelope","301 Arthur Ct, Bensenville, IL 60106"],["Supremex Naperville","1500 Shore Rd, Naperville, IL 60563"],["Supremex Chicago","4114 S Peoria St, Chicago, IL 60609"],["MSI","1501 Morse Ave, Elk Grove Village, IL 60007"],["Palatine Post Office","1300 E Northwest Hwy, Palatine, IL 60095"]];
let tasks=[],drivers=[],dragId=null;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function ymd(v){let d=new Date(v);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function fmt(v){return v?new Date(v).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"Time TBD"}
function options(){return '<option value="">Select…</option>'+LOC.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("")}
function taskCard(t){let st=(t.status||"pending").toLowerCase().replace(" ","_");return `<article class="task" draggable="true" data-id="${t.id}"><div class="task-top"><div class="route">${esc(t.pickup_name)} → ${esc(t.delivery_name)}</div><span class="grip">⋮⋮</span></div><div class="meta">${fmt(t.scheduled_at)}${t.job_client?" · "+esc(t.job_client):""}${t.pallet_qty!=null?" · "+t.pallet_qty+" pallets":""}</div><span class="tag ${t.priority==="high"?"high":""}">${esc(t.priority||"normal")}</span>${t.assigned_driver_id?` <span class="status ${st}">${esc((t.status||"assigned").replace("_"," "))}</span>`:""}<div class="task-actions"><button class="mini" onclick="event.stopPropagation();editTask(${t.id})">Edit</button><button class="mini danger" onclick="event.stopPropagation();removeTask(${t.id})">Delete</button></div></article>`}
function render(){
 let brain=tasks.filter(t=>!t.assigned_driver_id&&(t.planning_stage||"ready")==="brainstorm"),ready=tasks.filter(t=>!t.assigned_driver_id&&(t.planning_stage||"ready")!=="brainstorm");
 $("brainstorm").innerHTML=brain.length?brain.map(taskCard).join(""):'<div class="empty">Drop ideas here<br>Details can be incomplete.</div>';
 $("ready").innerHTML=ready.length?ready.map(taskCard).join(""):'<div class="empty">Drag planned work here<br>when it is ready to dispatch.</div>';
 $("brainCount").textContent=brain.length;$("readyCount").textContent=ready.length;
 $("drivers").innerHTML=drivers.map(d=>{let mine=tasks.filter(t=>Number(t.assigned_driver_id)===Number(d.id)&&t.status!=="completed").sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return `<section class="driver"><div class="driver-head"><span class="driver-name">${esc(d.name)}</span><span class="count">${mine.length}</span></div><div class="driver-routes" data-driver="${d.id}">${mine.length?mine.map(taskCard).join(""):'<div class="empty">Drop route here</div>'}</div></section>`}).join("");
 bindDrag();
}
function bindDrag(){
 document.querySelectorAll(".task").forEach(el=>{el.ondragstart=()=>{dragId=Number(el.dataset.id);el.classList.add("dragging")};el.ondragend=()=>{el.classList.remove("dragging");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))}});
 document.querySelectorAll(".dropzone,.driver-routes").forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add("over")};z.ondragleave=()=>z.classList.remove("over");z.ondrop=async e=>{e.preventDefault();z.classList.remove("over");if(!dragId)return;let target=e.target.closest(".task"),before=target?Number(target.dataset.id):null;if(z.dataset.driver)await moveDriver(dragId,Number(z.dataset.driver),before);else await moveStage(dragId,z.dataset.stage,before)}})
}
async function moveStage(id,stage,before){let list=tasks.filter(t=>!t.assigned_driver_id&&(t.planning_stage||"ready")===stage&&t.id!==id),idx=before?list.findIndex(t=>t.id===before):list.length;if(idx<0)idx=list.length;list.splice(idx,0,tasks.find(t=>t.id===id));for(let i=0;i<list.length;i++)await db.from("dispatch_tasks").update({planning_stage:stage,assigned_driver_id:null,status:"pending",sort_order:i}).eq("id",list[i].id);await load()}
async function moveDriver(id,driver,before){let list=tasks.filter(t=>Number(t.assigned_driver_id)===driver&&t.id!==id&&t.status!=="completed"),idx=before?list.findIndex(t=>t.id===before):list.length;if(idx<0)idx=list.length;list.splice(idx,0,tasks.find(t=>t.id===id));for(let i=0;i<list.length;i++)await db.from("dispatch_tasks").update({planning_stage:"assigned",assigned_driver_id:driver,status:list[i].status==="in_progress"?"in_progress":"assigned",sort_order:i}).eq("id",list[i].id);await load()}
async function load(){let [dr,tr]=await Promise.all([db.from("drivers").select("*").order("id"),db.from("dispatch_tasks").select("*").order("sort_order")]);if(dr.error||tr.error){$("conn").textContent="Connection error";alert((dr.error||tr.error).message);return}$("conn").textContent="Supabase connected";drivers=(dr.data||[]).map(d=>({id:d.id,name:d.name||d.full_name||d.driver_name||`Driver ${d.id}`}));tasks=(tr.data||[]).filter(t=>!t.scheduled_at||ymd(t.scheduled_at)===ymd(new Date()));render()}
function openTask(stage="brainstorm"){ $("form").reset();$("id").value="";$("stage").value=stage;$("pickup").innerHTML=options();$("delivery").innerHTML=options();$("modalTitle").textContent=stage==="brainstorm"?"Quick Planning Task":"New Task";$("modal").classList.add("show")}
function closeTask(){$("modal").classList.remove("show")}
function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;openTask(t.planning_stage||"ready");$("id").value=id;$("modalTitle").textContent="Edit Task";let pi=LOC.findIndex(x=>x[0]===t.pickup_name),di=LOC.findIndex(x=>x[0]===t.delivery_name);$("pickup").value=pi>=0?pi:"";$("delivery").value=di>=0?di:"";if(t.scheduled_at){let d=new Date(t.scheduled_at);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$("scheduled").value=d.toISOString().slice(0,16)}$("priority").value=t.priority||"normal";$("job").value=t.job_client||"";$("material").value=t.material||"";$("pallets").value=t.pallet_qty??"";$("type").value=t.task_type||"other";$("notes").value=t.instructions||""}
$("form").onsubmit=async e=>{e.preventDefault();let p=LOC[Number($("pickup").value)],d=LOC[Number($("delivery").value)];if(!p||!d)return;let payload={title:p[0]+" - "+d[0],pickup_name:p[0],pickup_address:p[1],delivery_name:d[0],delivery_address:d[1],scheduled_at:$("scheduled").value?new Date($("scheduled").value).toISOString():null,priority:$("priority").value,job_client:$("job").value||null,material:$("material").value||null,pallet_qty:$("pallets").value?Number($("pallets").value):null,task_type:$("type").value,instructions:$("notes").value||null};let id=$("id").value;if(id)await db.from("dispatch_tasks").update(payload).eq("id",Number(id));else await db.from("dispatch_tasks").insert({...payload,status:"pending",planning_stage:$("stage").value,sort_order:999});closeTask();await load()}
async function removeTask(id){if(!confirm("Delete this task?"))return;let {error}=await db.from("dispatch_tasks").delete().eq("id",id);if(error)return alert(error.message);await load()}
$("modal").onclick=e=>{if(e.target===$("modal"))closeTask()};load();setInterval(()=>{if(!$("modal").classList.contains("show"))load()},20000);
</script></body></html>
