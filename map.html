    return {id,name:v.name,x,oos,svc:sv,k:kk.k,stale:kk.stale,deg:hdg(x&&x.heading),drv,since:sinceOf(id,kk.k,x),stops:EV.filter(e=>Number(e.vehicle_id)===id&&ctDate(e.started_at)===today).length}});
  await coords(T.flatMap((t,i)=>pointsOf(t,i+1).map(p=>p.addr)));
  $("upd").textContent=(bad?"⚠ ":"")+"Updated "+clk(Date.now());
  drawAll();
}
/* ---------- drawing ---------- */
const qv=()=>$("q").value.trim().toLowerCase();
const truckMatch=k=>{const q=qv();return !q||(k.name+" "+(k.drv?k.drv.name:"")).toLowerCase().includes(q)};
function drawTrucks(){gTrucks.clearLayers();TM={};if(!$("oTr").checked)return;
  const list=TR.filter(k=>k.x&&k.x.lat!=null&&truckMatch(k)),pts=list.map(k=>map.latLngToContainerPoint([k.x.lat,k.x.lon])),grp=list.map(()=>-1);let g=0;
  list.forEach((k,i)=>{if(grp[i]>=0)return;grp[i]=g;list.forEach((k2,j)=>{if(j>i&&grp[j]<0&&pts[i].distanceTo(pts[j])<30)grp[j]=g});g++});
  const sm=map.getZoom()<9;
  list.forEach((k,i)=>{const mem=list.map((_,j)=>j).filter(j=>grp[j]===grp[i]);let ll2=[k.x.lat,k.x.lon];
    if(mem.length>1){const a=2*Math.PI*mem.indexOf(i)/mem.length,r=20;ll2=map.containerPointToLatLng(pts[mem[0]].add(L.point(Math.cos(a)*r,Math.sin(a)*r)))}
    const m=L.marker(ll2,{icon:L.divIcon({className:"",html:icon(k.k,k.stale,k.deg,sm,SEL===k.id),iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:SEL===k.id?1000:500,keyboard:false})
      .bindTooltip(esc(k.name)+(k.drv?" · "+esc(k.drv.name.split(" ")[0]):""),{direction:"top",offset:[0,-16],className:"tn"}).on("click",()=>selTruck(k.id,true));
    m.addTo(gTrucks);TM[k.id]=m;});
}
function drawPins(){gTasks.clearLayers();PINS={};TC={};if(!$("oTa").checked)return;const used={};
  T.filter(t=>!$("oOpen").checked||t.status!=="completed").forEach(t=>{const n=T.indexOf(t)+1,s=stOf(t),pts=pointsOf(t,n);
    pts.forEach(p=>{const c=ll(p.addr);if(!c||isBase(p.addr))return;const key=c.lat.toFixed(5)+","+c.lon.toFixed(5);const j=used[key]=(used[key]||0)+1,off=j>1?(j-1)*0.00018:0;
      const m=L.marker([c.lat+off,c.lon+off],{icon:L.divIcon({className:"",html:`<div class="pin ${SELT===t.id?"hl":""}" style="--c:${COL[s]}"><span>${esc(p.label)}</span></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]})})
        .bindPopup(`<b>#${n} ${esc(p.kind)}</b> · <span style="color:${COL[s]};font-weight:700">${STL[s]}</span><br>${esc(p.name||"")}<br><span style="opacity:.7">${esc(p.addr)}</span><br>${esc(who(t))}`).on("click",()=>selTask(t.id,false));
      m.addTo(gTasks);(PINS[t.id]=PINS[t.id]||[]).push(m)});
    const cs=pts.map(p=>ll(p.addr)).filter(Boolean);TC[t.id]=cs;if(cs.length>1)L.polyline(cs.map(c=>[c.lat,c.lon]),{color:COL[s],weight:3,opacity:.75,dashArray:"6 6"}).addTo(gTasks)});
}
function etaFor(k){const t=truckTasks(k.id,k.drv).find(t=>t.status==="in_progress");if(!t)return "";const e=window.SHIFT_ETA&&SHIFT_ETA.forTask({...t,vehicle_id:t.vehicle_id??k.id});return e?e.text:""}
function truckRow(k){const st=k.stale&&k.k!=="stopped"?"GPS stale":KL[k.k],eta=etaFor(k);
  return `<div class="row ${SEL===k.id?"hl":""}" onclick="selTruck(${k.id},true)"><div class="ic">${icon(k.k,k.stale,k.deg,false,false)}</div><div class="mid"><div class="nm">${esc(k.name)}${k.oos?`<span class="oos">${esc(SVC[k.svc.status]||"Out of service")}</span>`:""}</div>
   <div class="sb">${k.drv?"👤 "+esc(k.drv.name):"No driver scheduled now"}</div><div class="st ${k.stale&&k.k!=="stopped"?"stale":k.k}">${esc(st)}${k.k==="moving"&&k.x&&k.x.speed_mph!=null?" · "+Math.round(k.x.speed_mph)+" mph":""} <span style="color:var(--mut);font-weight:500">${esc(sinceTxt(k.since))}</span></div>
   <div class="sb">${esc(k.x?.address||"No GPS yet")}</div>${eta?`<div class="eta">🕒 ${esc(eta)}</div>`:""}</div></div>`}
function trucksTab(){const c={all:TR.length,moving:0,idle:0,stopped:0};TR.forEach(k=>c[k.k]++);
  $("chips").style.display="";$("chips").innerHTML=[["all","All"],["moving","Moving"],["idle","Idling"],["stopped","Stopped"]].map(([k,l])=>`<button type="button" class="chip ${CHIP===k?"on":""}" onclick="setChip('${k}')">${l} (${c[k]})</button>`).join("");
  const L2=TR.filter(k=>(CHIP==="all"||k.k===CHIP)&&truckMatch(k)).sort((a,b)=>({moving:0,idle:1,stopped:2}[a.k]-{moving:0,idle:1,stopped:2}[b.k])||a.name.localeCompare(b.name));
  return L2.map(truckRow).join("")||'<div class="empty">No trucks match.</div>'}
function taskRow(t){const n=T.indexOf(t)+1,s=stOf(t),pts=pointsOf(t,n);const e=window.SHIFT_ETA&&t.status==="in_progress"?SHIFT_ETA.forTask(t):null;
  return `<div class="row ${SELT===t.id?"hl":""}" id="it${t.id}" onclick="selTask(${t.id},true)"><span class="num" style="--c:${COL[s]}">${n}</span><div class="mid"><div class="nm" style="font-size:14px">${esc(t.title||((t.pickup_name||"")+" → "+(t.delivery_name||"")))} <span class="st" style="color:${COL[s]}">${STL[s]}</span></div>
   ${pts.map(p=>`<div class="ln"><b>${esc(p.label)}</b> ${esc(p.name||"")} <span style="color:var(--mut)">${esc(p.addr||"")}</span>${p.addr&&!ll(p.addr)?' <span class="nogeo">· not on map</span>':""}</div>`).join("")}
   <div class="sb">${esc(who(t))}${t.scheduled_at?" · "+esc(clk(t.scheduled_at)):""}</div>${e?`<div class="eta">🕒 ${esc(e.text)}</div>`:""}${closest(t,n)}</div></div>`}
function tasksTab(){$("chips").style.display="none";const q=qv();
  const L2=T.filter(t=>(!$("oOpen").checked||t.status!=="completed")&&(!q||[t.title,t.pickup_name,t.delivery_name,t.pickup_address,t.delivery_address,who(t)].join(" ").toLowerCase().includes(q)));
  return (L2.map(taskRow).join("")||'<div class="empty">No tasks for this day.</div>')+'<div class="foot">Same tasks as the board for this day. Pins: A = start / pickup, B = delivery, route stops numbered. Lines are straight, not driving routes. “Closest truck” = straight-line distance — a hint, not drive time.</div>'}
function detail(k){const tk=truckTasks(k.id,k.drv),eta=etaFor(k);$("chips").style.display="none";
  return `<div class="det"><button class="back" type="button" onclick="selTruck(null)">‹ All trucks</button><div style="display:flex;gap:10px;align-items:center">${icon(k.k,k.stale,k.deg,false,false)}<h2>${esc(k.name)}</h2>${k.oos?`<span class="oos">${esc(SVC[k.svc.status])}</span>`:""}</div>
   <div class="grid"><div><div class="k">Driver</div><div class="v">${k.drv?esc(k.drv.name)+` <span style="color:var(--mut);font-size:12px">(${esc(truckSource(k.drv)==="pretrip"?"pre-trip":truckSource(k.drv)==="hand"?"set by hand":"scheduled")})</span>`:"None scheduled now"}</div></div>
   <div><div class="k">Status</div><div class="v st ${k.k}">${esc(k.stale&&k.k!=="stopped"?"GPS stale":KL[k.k])} <span style="color:var(--mut);font-weight:500">${esc(sinceTxt(k.since))}</span></div></div>
   <div><div class="k">Speed</div><div class="v">${k.x&&k.x.speed_mph!=null?Math.round(k.x.speed_mph)+" mph":"—"}${k.deg!=null&&k.k==="moving"?" · "+esc(k.x.heading):""}</div></div>
   <div><div class="k">Stops today</div><div class="v">${k.stops}</div></div></div>
   <div class="k">Location</div><div class="v">${esc(k.x?.address||"No GPS yet")}</div><div class="sb" style="color:var(--mut);font-size:12px">Last GPS report ${k.x?esc(clk(k.x.reported_at))+" ("+esc(ago(k.x.reported_at))+")":"—"}</div>
   ${eta?`<div class="eta" style="margin-top:8px">🕒 ${esc(eta)}</div>`:""}
   <div class="k">Today's tasks (${tk.length})</div>${tk.map(t=>`<div class="tk"><b>#${T.indexOf(t)+1}</b> ${esc((t.pickup_name||"")+" → "+(t.delivery_name||""))} · <span style="color:${COL[stOf(t)]};font-weight:700">${STL[stOf(t)]}</span></div>`).join("")||'<div class="sb" style="color:var(--mut)">None</div>'}
   <a class="btn" href="trucks.html">Open Trucks page ›</a></div>`}
function drawList(){const k=SEL!=null?TR.find(x=>x.id===SEL):null;$("body").innerHTML=k&&TAB==="trucks"?detail(k):TAB==="trucks"?trucksTab():tasksTab()}
function drawAll(){drawPins();drawTrucks();drawList();
  if(!fitted){const all=[...TR.filter(k=>k.x&&k.x.lat!=null).map(k=>[k.x.lat,k.x.lon]),...Object.values(TC).flat().map(c=>[c.lat,c.lon])];if(all.length){fitAll(all);fitted=true}}}
function pad(){const desk=matchMedia("(min-width:900px)").matches;return desk?{paddingTopLeft:[430,80],paddingBottomRight:[40,40]}:{paddingTopLeft:[30,70],paddingBottomRight:[30,(parseInt(getComputedStyle(document.documentElement).getPropertyValue("--h"))||170)+20]}}
function fitAll(all){all=all||TR.filter(k=>k.x&&k.x.lat!=null).map(k=>[k.x.lat,k.x.lon]);if(all.length)map.fitBounds(all,{...pad(),maxZoom:13})}
/* ---------- interaction ---------- */
window.setChip=k=>{CHIP=k;drawList()};
window.selTruck=function(id,zoom){SEL=id;SELT=null;TAB="trucks";tabUI();drawTrucks();drawPins();drawList();const k=TR.find(x=>x.id===id);
  if(k&&zoom&&k.x&&k.x.lat!=null){map.flyTo([k.x.lat,k.x.lon],15,{duration:.6});setTimeout(()=>{TM[id]&&TM[id].openTooltip()},700);if(!matchMedia("(min-width:900px)").matches&&sheetH()<window.innerHeight*.45)setSheet("half")}};
window.selTask=function(id,fromList){SELT=id;SEL=null;TAB="tasks";tabUI();drawPins();drawTrucks();drawList();const cs=TC[id]||[];
  if(fromList&&cs.length){map.fitBounds(L.latLngBounds(cs.map(c=>[c.lat,c.lon])).pad(.25),{...pad(),maxZoom:13});PINS[id]&&PINS[id][0]&&PINS[id][0].openPopup()}
  if(!fromList){const e=$("it"+id);e&&e.scrollIntoView({behavior:"smooth",block:"nearest"})}};
function tabUI(){$("tbT").classList.toggle("on",TAB==="trucks");$("tbK").classList.toggle("on",TAB==="tasks")}
$("tbT").onclick=()=>{TAB="trucks";SELT=null;tabUI();drawPins();drawList()};$("tbK").onclick=()=>{TAB="tasks";SEL=null;tabUI();drawTrucks();drawList()};
$("q").oninput=()=>{$("sx").style.display=$("q").value?"block":"none";drawTrucks();drawList()};$("sx").onclick=()=>{$("q").value="";$("q").oninput()};
$("q").onkeydown=e=>{if(e.key==="Enter"){const m=TR.filter(truckMatch);if(m.length===1)selTruck(m[0].id,true);$("q").blur()}};
const pops={filt:"popF",lay:"popL"};for(const [b,p] of Object.entries(pops))$(b).onclick=e=>{e.stopPropagation();const o=$(p).classList.contains("show");document.querySelectorAll(".pop").forEach(x=>x.classList.remove("show"));document.querySelectorAll("#filt,#lay").forEach(x=>x.classList.remove("on"));if(!o){$(p).classList.add("show");$(b).classList.add("on")}};
document.addEventListener("click",e=>{if(!e.target.closest(".pop")&&!e.target.closest("#filt,#lay")){document.querySelectorAll(".pop").forEach(x=>x.classList.remove("show"));document.querySelectorAll("#filt,#lay").forEach(x=>x.classList.remove("on"))}});
$("oTr").onchange=drawTrucks;$("oTa").onchange=drawPins;$("oOpen").onchange=()=>{drawPins();drawList()};
document.querySelectorAll("input[name=bm]").forEach(r=>r.onchange=()=>setBase(r.value));
$("recenter").onclick=()=>{SEL=null;drawTrucks();drawList();fitAll()};
map.on("zoomend",drawTrucks);map.on("click",()=>{document.querySelectorAll(".pop").forEach(x=>x.classList.remove("show"))});
/* ---------- bottom sheet (phone) ---------- */
const SNAP={peek:178,half:()=>Math.round(innerHeight*.5),full:()=>innerHeight-74};
const sheetH=()=>$("sheet").getBoundingClientRect().height;
function setSheet(s){const h=typeof SNAP[s]==="function"?SNAP[s]():SNAP[s];document.documentElement.style.setProperty("--h",h+"px");$("sheet").style.height=h+"px"}
(()=>{const g=$("grab"),sh=$("sheet");let y0=0,h0=0,drag=false,moved=false;
  g.addEventListener("pointerdown",e=>{drag=true;moved=false;y0=e.clientY;h0=sheetH();sh.classList.add("drag");g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",e=>{if(!drag)return;const h=Math.max(120,Math.min(innerHeight-60,h0+(y0-e.clientY)));if(Math.abs(e.clientY-y0)>4)moved=true;sh.style.height=h+"px"});
  g.addEventListener("pointerup",e=>{if(!drag)return;drag=false;sh.classList.remove("drag");const h=sheetH();
    if(!moved){setSheet(h<SNAP.half()-10?"half":h<SNAP.full()-10?"full":"peek");return}
    const c=[["peek",SNAP.peek],["half",SNAP.half()],["full",SNAP.full()]].sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];setSheet(c)});
})();
if(!matchMedia("(min-width:900px)").matches)setSheet("peek");
/* ---------- refresh ---------- */
let busy=false;async function refresh(){if(busy||document.hidden)return;busy=true;try{await load()}catch(e){console.error(e);$("upd").textContent="⚠ "+e.message}finally{busy=false}}
$("day").value=ctDate(Date.now());$("day").onchange=()=>{fitted=false;refresh()};
refresh();setInterval(refresh,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script></body></html>
